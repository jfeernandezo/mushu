services:
  postgres:
    image: postgres:16-alpine
    container_name: mushu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mushu
      POSTGRES_PASSWORD: mushu
      POSTGRES_DB: mushu
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mushu']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mushu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mushu-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: mushu
      MINIO_ROOT_PASSWORD: mushu-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # web and worker are commented out for local dev (run via `pnpm dev`).
  # Uncomment for production-like deployment:
  #
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   environment:
  #     - DATABASE_URL=postgres://mushu:mushu@postgres:5432/mushu
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   ports:
  #     - '3000:3000'
  #
  # worker:
  #   build:
  #     context: .
  #     dockerfile: apps/worker/Dockerfile
  #   environment:
  #     - DATABASE_URL=postgres://mushu:mushu@postgres:5432/mushu
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
